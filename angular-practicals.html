document.getElementById("code").textContent = `

PRACTICAL 2
COMPONENTS AND DATA BINDING


A) Generate Components

ng g c parent
ng g c child


B) Data Binding

parent.html

<h2>Parent Component</h2>

<p>{{ name }}</p>

<input [value]="name">

<button (click)="changeName()">Change Name</button>

<input [(ngModel)]="name">


parent.ts

import { Component } from '@angular/core';
import { FormsModule } from '@angular/forms';
import { Child } from '../child/child';

@Component({
  selector: 'app-parent',
  imports: [FormsModule, Child],
  templateUrl: './parent.html'
})
export class Parent {

  name = 'Nidhi';

  changeName() {
    this.name = 'Divya';
  }

  showMessage(msg: string) {
    alert(msg);
  }
}


C) Parent Child Interaction

parent.html

<app-child
  [name]="name"
  (msg)="showMessage($event)">
</app-child>


child.ts

import { Component, Input, Output, EventEmitter } from '@angular/core';

@Component({
  selector: 'app-child',
  imports: [],
  templateUrl: './child.html'
})
export class Child {

  @Input() name = '';

  @Output() msg = new EventEmitter<string>();

  send() {
    this.msg.emit('Hello Parent!');
  }
}


child.html

<h3>Child Component</h3>

<p>Name: {{ name }}</p>

<button (click)="send()">Send Message</button>


app.ts

import { Component } from '@angular/core';
import { Parent } from './parent/parent';

@Component({
  selector: 'app-root',
  imports: [Parent],
  templateUrl: './app.html'
})
export class App {}


app.html

<app-parent></app-parent>

`;
}

import { Component } from '@angular/core';
import {
  FormGroup,
  FormControl,
  ReactiveFormsModule,
  Validators
} from '@angular/forms';

@Component({
  selector: 'app-root',
  imports: [ReactiveFormsModule],
  templateUrl: './app.html'
})
export class App {

  form = new FormGroup({

    name: new FormControl(
      '',

    }

  }

REST API INTEGRATION


A) Configure HttpClientModule

app.ts

@Component({

B) Fetch Data from REST API

student.service.ts

import { Injectable } from '@angular/core';
import { HttpClient } from '@angular/common/http';

@Injectable({
  providedIn: 'root'
})
export class StudentService {

  url = 'https://jsonplaceholder.typicode.com/users';

  constructor(private http: HttpClient) {}

  getStudents() {
    return this.http.get(this.url);
  }

}


C) Display API Data

app.ts

import { Component } from '@angular/core';
import { StudentService } from './student.service';
import { CommonModule } from '@angular/common';

@Component({
  selector: 'app-root',
  imports: [CommonModule],
  templateUrl: './app.html'
})
export class App {

  students: any[] = [];

  constructor(private service: StudentService) {

    this.service.getStudents().subscribe(data => {
      this.students = data as any[];
    });

  }

}


app.html

<h2>Students</h2>

<div *ngFor="let student of students">

  <p>Name: {{ student.name }}</p>

  <p>Email: {{ student.email }}</p>

  <hr>

</div>
